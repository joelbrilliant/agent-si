[agents.loader]
kind = "collector"
manual_sources = true
operations = "*"
approval = "none"
approvers = []
author_principal = false

[agents.owner]
kind = "collector"
manual_sources = true
operations = ["add_source"]
approval = "none"
approvers = []
author_principal = true

[agents.scan]
kind = "extractor"
operations = ["apply_candidate", "upsert_decision", "upsert_action", "upsert_thread_link", "add_claim"]
approval = "verified"
approvers = ["owner"]
author_principal = false

[collectors]

[truth.entities]
excloud = ["Example Cloud"]
exbasic = ["Example Basic"]
expro = ["Example Pro"]
exteam = ["Example Team"]
exscale = ["Example Scale"]
exedge = ["Example Edge"]
exstudio = ["Example Studio"]
