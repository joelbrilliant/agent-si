gpu_memory = ["VRAM", "GPU memory"]
region = ["hosting region"]
sso = ["single sign-on"]
support_hours = ["support response time"]
retention_days = ["log retention"]
launch_date = ["launch date"]
current_version = ["version"]
pentest_date = ["penetration test"]
